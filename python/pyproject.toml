[project]
name = "askkit"
version = "0.1.0"
description = "A command-line app built on a large language model."
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.8.0",
    "httpx2>=2.16.0",
    "openai>=3.57.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "tokenizers==0.23.3",
]

[project.scripts]
askkit = "askkit.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 78

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["held_out: a case of the held-out part, run with -m held_out"]
addopts = ["-m", "not held_out"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
